spring.application.name=MerdaDoTrabalhoIntegrador

# MySQL do XAMPP (usuario root, senha vazia por padrão)
spring.datasource.url=jdbc:mysql://localhost:3306/trabalho_integrador?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logs: TRACE < DEBUG < INFO < WARN < ERROR
logging.level.root=INFO
logging.level.com.sinodal.merdadotrabalhointegrador=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Arquivo de importação de usuários (caminho relativo à pasta onde a aplicação roda)
app.usuarios.arquivo=./usuarios.txt
